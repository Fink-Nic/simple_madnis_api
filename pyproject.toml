[build-system]
requires = ["setuptools>=61.0"]

[project]
name = "madnis_gammaboard_api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
authors = [ { name = "Nic Fink", email = "nic.fink@students.unibe.ch" } ]

dependencies = [
    "madnis @ git+https://github.com/madgraph-ml/madnis.git@main",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]